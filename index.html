<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>利用申請・マイページ</title>
    <!-- Tailwind CSS (デザイン用CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <div class="max-w-md w-full mx-auto p-4">
        <!-- ヘッダーは機能名のみ -->
        <header class="mb-6 text-center">
            <h1 class="text-xl font-bold text-gray-900">利用申請・マイページ</h1>
        </header>

        <!-- アプリ名付きメッセージ・ロック通知エリア -->
        <div id="app-message-box" class="hidden p-3 mb-4 rounded text-sm"></div>

        <!-- 現在のステータス表示 -->
        <div class="bg-white p-4 rounded-lg shadow mb-4">
            <p id="status-display" class="text-sm font-medium text-gray-700">読み込み中...</p>
        </div>

        <!-- 登録・申請フォームカード（未登録時のみ表示） -->
        <div id="registration-card" class="hidden bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-4 text-gray-800">新規利用・権限申請</h2>
            
            <form onsubmit="submitApplication(event)" class="space-y-4">
                <!-- LINE表示名（確認用） -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">LINE表示名</label>
                    <input type="text" id="lineDisplayName" readonly class="w-full px-3 py-2 border rounded bg-gray-100 text-sm">
                </div>

                <!-- 氏名入力欄 -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">氏名 <span class="text-red-500">*</span></label>
                    <input type="text" id="fullName" required placeholder="フルネームを入力してください" class="w-full px-3 py-2 border rounded text-sm bg-white">
                </div>

                <!-- 希望権限 -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">希望権限 <span class="text-red-500">*</span></label>
                    <select id="role" onchange="handleRoleOrTypeChange()" class="w-full px-3 py-2 border rounded text-sm bg-white">
                        <!-- JSで動的生成 -->
                    </select>
                </div>

                <!-- 申請種別（世帯管理者用） -->
                <div id="field-applicationType" class="hidden">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">申請種別</label>
                    <select id="applicationType" onchange="handleRoleOrTypeChange()" class="w-full px-3 py-2 border rounded text-sm bg-white">
                        <option value="新規登録">新規登録</option>
                        <option value="管理者追加">管理者追加</option>
                    </select>
                </div>

                <!-- 対象世帯ID -->
                <div id="field-targetHouseholdId" class="hidden">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">世帯ID <span class="text-red-500">*</span></label>
                    <input type="text" id="targetHouseholdId" placeholder="世帯IDを入力してください" class="w-full px-3 py-2 border rounded text-sm">
                </div>

                <!-- 世帯名（新規登録時のみ） -->
                <div id="field-householdName" class="hidden">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">世帯名 <span class="text-red-500">*</span></label>
                    <input type="text" id="householdName" placeholder="例: 山田家" class="w-full px-3 py-2 border rounded text-sm">
                </div>

                <!-- システム管理者キーワード -->
                <div id="field-keyword" class="hidden">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">システム管理者キーワード <span class="text-red-500">*</span></label>
                    <input type="password" id="adminKeyword" placeholder="キーワードを入力" class="w-full px-3 py-2 border rounded text-sm">
                </div>

                <!-- 送信ボタン -->
                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded font-semibold text-sm hover:bg-blue-700 transition">
                    申請する
                </button>
            </form>
        </div>
    </div>

    <!-- 外部スクリプト読み込み -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="config.js"></script>
    <script src="apply.js"></script>
</body>
</html>
