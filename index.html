<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連携テスト</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="padding: 20px;">
    <h2>システム連携テスト</h2>
    <p id="status">LIFF初期化中...</p>
    <button id="sendBtn" style="display:none; padding:10px; background:#00B900; color:#fff; border:none;">
        GASへテストデータを送信
    </button>

    <script>
        const LIFF_ID = "2010847852-UMICXBtd"; 
        // ▼ GASでデプロイした「ウェブアプリのURL」に書き換える
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzBwNfjxLijXEhuNd3xEyzeg0BT3XcmAX6CXgBnj3GNldnxOkBAXURQL8jc-vrv5FI_/exec"; 

        let currentUserId = "";

        window.addEventListener('DOMContentLoaded', () => {
            liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        liff.getProfile().then(profile => {
                            currentUserId = profile.userId;
                            document.getElementById('status').innerText = `準備完了 (ID: ${currentUserId})`;
                            document.getElementById('sendBtn').style.display = "block";
                        });
                    }
                });
        });

       // ボタンを押した時の送信処理
        document.getElementById('sendBtn').addEventListener('click', () => {
            document.getElementById('status').innerText = "送信中...";
            
            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors', // ★ここを追加（CORSエラーを回避する設定）
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({
                    userId: currentUserId,
                    message: "GitHub Pagesからのテスト送信成功！"
                })
            })
            .then(() => {
                // ※ mode: 'no-cors' の仕様上、レスポンスの中身（jsonなど）は読み取れませんが、
                //   エラーなくここまで到達すれば送信は成功しています。
                document.getElementById('status').innerText = "送信完了しました！スプレッドシートを確認してください。";
            })
            .catch(error => {
                document.getElementById('status').innerText = "送信エラー: " + error;
            });
        });
    </script>
</body>
</html>
