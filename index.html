<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読み込み中...</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex items-center justify-center h-screen">
  <div class="text-center">
    <p id="loading-text" class="text-gray-600 font-medium">システムを起動中...</p>
  </div>

  <script src="config.js"></script>
  <script>
    window.onload = async function() {
      try {
        if (typeof CONFIG === 'undefined') {
          document.getElementById("loading-text").innerText = "config.js が読み込まれていません。";
          return;
        }

        await liff.init({ liffId: CONFIG.LIFF_ID });
        
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const lineUserId = profile.userId;

        // サーバーにステータスを問い合わせ
        const url = `${CONFIG.GAS_WEB_APP_URL}?action=checkStatus&lineUserId=${encodeURIComponent(lineUserId)}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.status === "success") {
          if (result.approvalStatus === "承認済") {
            // 承認済みの場合はスケジュール画面へジャンプ
            window.location.replace("schedule.html");
          } else {
            // 未登録または申請中の場合は申請画面へジャンプ
            window.location.replace("apply.html");
          }
        } else {
          document.getElementById("loading-text").innerText = "ステータスの取得に失敗しました: " + result.message;
        }
      } catch (err) {
        console.error(err);
        document.getElementById("loading-text").innerText = "初期化エラーが発生しました。";
      }
    };
  </script>
</body>
</html>
